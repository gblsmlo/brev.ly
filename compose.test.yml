services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: brevly_test
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d brevly_test"]
      interval: 2s
      timeout: 2s
      retries: 10
    ports:
      - "127.0.0.1:${POSTGRES_TEST_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
